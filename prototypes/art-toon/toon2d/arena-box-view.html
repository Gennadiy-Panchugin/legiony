<h1>Императорская ложа</h1>
<p class="lead">Четыре варианта, снятых прямо в игре (Вейи, крик толпы на максимуме, над ложей видна рука императора «палец вверх»). Переключение в игре: <b>?box=A</b>, B, C или D в адресе <b>citywar.html</b>.</p>
<div class="row">
  <figure><img src="arena-box-A.jpg" alt="Вариант А"><figcaption><b>А · Пульвинар</b>Мраморный подиум, колонны, фиолетовый навес с орлом, император на золотом троне, четыре сенатора, два стражника, знамёна SPQR.</figcaption></figure>
  <figure><img src="arena-box-B.jpg" alt="Вариант Б"><figcaption><b>Б · Павильон</b>Золотой купол на колоннах с красными драпировками, император на троне, двое слуг с опахалами. Самая «восточная» и лёгкая по силуэту.</figcaption></figure>
  <figure><img src="arena-box-C.jpg" alt="Вариант В"><figcaption><b>В · Триумфальная арка</b>Белая арка с надписью SPQR и золотой квадригой наверху, император в проёме на ступенях. Самая заметная и «римская».</figcaption></figure>
  <figure><img src="arena-box-D.jpg" alt="Вариант Г"><figcaption><b>Г · Балкон над воротами</b>Три арки в стене над северными воротами, император в центральной, знамёна по сторонам. Строго по оси арены, виден с любого места.</figcaption></figure>
